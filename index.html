<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Flow Metrics Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Sea brand — Primary */
    --sea-clear: #4dbdc6;
    --sea-strong: #005f85;
    /* Sea brand — Secondary */
    --sea-faded: #4c778b;
    --sea-tint: #dbe4e8;
    /* Sea brand — Tertiary */
    --ocean: #003755;
    --teal: #0b707d;
    --mint: #b4dac3;
    --coral: #ee7766;
    --honey: #fcca83;
    --rust: #c76f37;
    --sun: #ffefaf;
    /* Functional */
    --bg: #f3f6f8;
    --card: #ffffff;
    --text: #003755;
    --text-secondary: #4c778b;
    --border: rgba(76,119,139,0.15);
    /* Percentile colors */
    --p50: #4dbdc6;
    --p85: #fcca83;
    --p96: #ee7766;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Gesta', 'Gesta W01 Regular', 'Nunito Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  .page-header {
    background: linear-gradient(135deg, var(--ocean) 0%, var(--sea-strong) 55%, var(--teal) 100%);
    padding: 36px 40px 32px;
    position: relative;
    overflow: hidden;
  }
  .page-header::before {
    content: '';
    position: absolute;
    top: -40%;
    right: -15%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(77,189,198,0.1) 0%, transparent 70%);
    border-radius: 50%;
  }
  .header-content {
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .header-logo {
    height: 52px;
    width: auto;
    flex-shrink: 0;
  }
  .header-text h1 {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.3px;
  }
  .header-text p {
    font-size: 14px;
    color: var(--sea-clear);
    margin-top: 4px;
    opacity: 0.9;
  }

  /* ── DASHBOARD ── */
  .dashboard {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 40px 60px;
  }

  /* ── KPI CARDS ── */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
    margin-top: -20px;
    margin-bottom: 28px;
    position: relative;
    z-index: 2;
  }
  .kpi-card {
    background: var(--card);
    border-radius: 10px;
    padding: 20px 22px;
    box-shadow: 0 2px 12px rgba(0,55,85,0.06);
    border: 1px solid var(--border);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .kpi-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,55,85,0.1);
  }
  .kpi-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--sea-faded);
    margin-bottom: 6px;
  }
  .kpi-value {
    font-size: 30px;
    font-weight: 800;
    color: var(--ocean);
    line-height: 1;
  }
  .kpi-value span {
    font-size: 14px;
    font-weight: 600;
    color: var(--sea-faded);
    margin-left: 3px;
  }
  .kpi-sub {
    font-size: 11px;
    color: var(--sea-faded);
    margin-top: 5px;
  }

  /* ── CHART SECTION ── */
  .chart-section {
    background: var(--card);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 2px 12px rgba(0,55,85,0.06);
    border: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .chart-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .chart-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--ocean);
  }
  .chart-subtitle {
    font-size: 12px;
    color: var(--sea-faded);
    margin-top: 3px;
  }
  .legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    align-items: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .legend-line { width: 22px; height: 3px; border-radius: 2px; }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--teal); background: var(--sea-clear);
  }
  .chart-container { width: 100%; overflow-x: auto; }
  .chart-container svg { width: 100%; height: auto; display: block; }

  /* ── TOOLTIP ── */
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--ocean);
    color: #fff;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.6;
    box-shadow: 0 8px 28px rgba(0,55,85,0.3);
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 220px;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip-id {
    font-size: 10px;
    color: var(--sea-clear);
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 3px;
  }
  .tooltip-val { font-weight: 700; }

  /* ── TABLE ── */
  .data-table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--sea-faded);
    text-align: left;
    padding: 10px 14px;
    border-bottom: 2px solid var(--sea-tint);
    white-space: nowrap;
  }
  tbody td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    white-space: nowrap;
  }
  tbody tr:hover { background: rgba(77,189,198,0.05); }
  .sp-badge {
    display: inline-block;
    background: rgba(11,112,125,0.08);
    padding: 2px 10px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 12px;
    color: var(--teal);
  }

  /* ── BOTTOM GRID ── */
  .bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  /* ── FOOTER ── */
  .footer {
    text-align: center;
    margin-top: 36px;
    padding: 18px;
    font-size: 11px;
    color: var(--sea-faded);
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  /* ── ANIMATION ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .kpi-card { animation: fadeUp 0.5s ease both; }
  .kpi-card:nth-child(2) { animation-delay: 0.06s; }
  .kpi-card:nth-child(3) { animation-delay: 0.12s; }
  .kpi-card:nth-child(4) { animation-delay: 0.18s; }
  .kpi-card:nth-child(5) { animation-delay: 0.24s; }
  .chart-section { animation: fadeUp 0.6s ease both; animation-delay: 0.2s; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .page-header { padding: 28px 20px; }
    .header-content { flex-wrap: wrap; gap: 12px; }
    .header-text h1 { font-size: 22px; }
    .dashboard { padding: 0 20px 40px; }
    .kpi-row { grid-template-columns: 1fr 1fr; }
    .bottom-grid { grid-template-columns: 1fr; }
    .chart-section { padding: 18px; }
  }
  @media (max-width: 480px) {
    .kpi-row { grid-template-columns: 1fr; }
  }
</style>
</head>

<script>

function percentile(arr, p) {
  const sorted = [...arr].sort((a,b) => a-b);
  const i = (p/100)*(sorted.length-1);
  const lo = Math.floor(i), hi = Math.ceil(i);
  return lo===hi ? sorted[lo] : sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo);
}

const cycles = stories.map(s=>s.cycle);
const leads  = stories.map(s=>s.lead);
const p50c = percentile(cycles,50), p85c = percentile(cycles,85), p96c = percentile(cycles,96);

const avgL = leads.reduce((a,b)=>a+b,0)/leads.length;
const totalSP = stories.filter(s=>s.sp!==null).reduce((a,s)=>a+s.sp,0);
const estCount = stories.filter(s=>s.sp!==null).length;

const dash = document.getElementById('dashboard');

// ── SCATTERPLOT BUILDER ──
function buildScatter(data, key, p50, p85, p96) {
  const W=1100, H=400;
  const pad={top:36,right:28,bottom:56,left:56};
  const cw=W-pad.left-pad.right, ch=H-pad.top-pad.bottom;

  const dates = data.map(d=>new Date(d.closed).getTime());
  const minD=Math.min(...dates), maxD=Math.max(...dates), rangeD=maxD-minD||1;
  const maxV = Math.max(...data.map(d=>d[key]), p96)*1.15;

  const x = d => pad.left+((new Date(d).getTime()-minD)/rangeD)*cw;
  const y = v => pad.top+ch-(v/maxV)*ch;

  // Grid + Y axis
  const step = maxV<=20?5:maxV<=50?10:maxV<=100?20:50;
  let grid='';
  for(let v=0;v<=maxV;v+=step){
    grid+=`<line x1="${pad.left}" y1="${y(v)}" x2="${W-pad.right}" y2="${y(v)}" stroke="rgba(76,119,139,0.12)" stroke-width="1"/>`;
    grid+=`<text x="${pad.left-8}" y="${y(v)+4}" text-anchor="end" fill="#4c778b" font-size="11" font-weight="600">${v}</text>`;
  }

  // X axis date labels
  const seenDates=new Set();
  let dtLabels='';
  data.forEach(d=>{
    const dt=new Date(d.closed);
    const lbl=dt.getDate()+' '+dt.toLocaleDateString('en-GB',{month:'short'});
    if(!seenDates.has(lbl)){
      seenDates.add(lbl);
      dtLabels+=`<text x="${x(d.closed)}" y="${H-pad.bottom+22}" text-anchor="middle" fill="#4c778b" font-size="10" font-weight="600" transform="rotate(-35 ${x(d.closed)} ${H-pad.bottom+22})">${lbl}</text>`;
    }
  });

  // Percentile lines
  function pLine(val, color, label, dashArr){
    const yy=y(val);
    if(yy<pad.top) return '';
    const tw = label.length*6.5+16;
    return `
      <line x1="${pad.left}" y1="${yy}" x2="${W-pad.right}" y2="${yy}" stroke="${color}" stroke-width="2" stroke-dasharray="${dashArr}" opacity="0.85"/>
      <rect x="${W-pad.right+4}" y="${yy-11}" width="${tw}" height="22" rx="4" fill="${color}" opacity="0.12"/>
      <text x="${W-pad.right+12}" y="${yy+4}" fill="${color}" font-size="11" font-weight="700">${label}</text>
    `;
  }
  const pLines = pLine(p50,'#4dbdc6',`P50: ${p50.toFixed(1)}d`,'8 4')
               + pLine(p85,'#fcca83',`P85: ${p85.toFixed(1)}d`,'6 3')
               + pLine(p96,'#ee7766',`P96: ${p96.toFixed(1)}d`,'3 3');

  // Dots
  const dots = data.map(d => {
    const cx=x(d.closed), cy=y(d[key]);
    const r = d.sp!==null ? Math.max(6,Math.min(16,4+d.sp*1.2)) : 7;
    const sp = d.sp!==null ? d.sp : '–';
    return `<circle class="dot" cx="${cx}" cy="${cy}" r="${r}"
      fill="#4dbdc6" fill-opacity="0.6" stroke="#0b707d" stroke-width="2"
      data-id="${d.id}" data-closed="${d.closed}" data-val="${d[key]}" data-sp="${sp}" data-lead="${d.lead}" data-cycle="${d.cycle}"
      style="cursor:pointer;transition:r 0.15s,fill-opacity 0.15s;"/>`;
  }).join('');

  return `<svg viewBox="0 0 ${W+95} ${H}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${H-pad.bottom}" stroke="#dbe4e8" stroke-width="1.5"/>
    <line x1="${pad.left}" y1="${H-pad.bottom}" x2="${W-pad.right}" y2="${H-pad.bottom}" stroke="#dbe4e8" stroke-width="1.5"/>
    ${grid}${dtLabels}${pLines}${dots}
    <text x="12" y="${pad.top+ch/2}" text-anchor="middle" fill="#4c778b" font-size="11" font-weight="700" letter-spacing="1" transform="rotate(-90 12 ${pad.top+ch/2})">DAYS</text>
  </svg>`;
}

const legendHTML = `<div class="legend">

  <div class="legend-item"><div class="legend-line" style="background:#4dbdc6;opacity:0.7;"></div> 50th %</div>

const rows = stories.map(s => {

// ── TOOLTIPS ──
const tooltip = document.getElementById('tooltip');
document.querySelectorAll('.dot').forEach(dot => {
  dot.addEventListener('mouseenter', e => {
    const d = e.target.dataset;
    const dt = new Date(d.closed);
    const ds = dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    tooltip.innerHTML = `
      <div class="tooltip-id">ID ${d.id}</div>
      <div>Closed: <span class="tooltip-val">${ds}</span></div>
      <div>Cycle: <span class="tooltip-val">${d.cycle} days</span></div>
      <div>Lead: <span class="tooltip-val">${d.lead} days</span></div>
      <div>Story Pts: <span class="tooltip-val">${d.sp}</span></div>`;
    tooltip.classList.add('visible');
    e.target.setAttribute('fill-opacity','1');
    e.target.setAttribute('r', parseFloat(e.target.getAttribute('r'))+3);
  });
  dot.addEventListener('mousemove', e => {
    tooltip.style.left = (e.clientX+16)+'px';
    tooltip.style.top = (e.clientY-10)+'px';
  });
  dot.addEventListener('mouseleave', e => {
    tooltip.classList.remove('visible');
    e.target.setAttribute('fill-opacity','0.6');
    e.target.setAttribute('r', parseFloat(e.target.getAttribute('r'))-3);
  });
});
